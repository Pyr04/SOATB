<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <title>SOATB - Čtení materiálu</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        html { scroll-behavior: smooth; }
        .reader-layout { display: flex; height: 100vh; overflow: hidden; background-color: var(--bg-body); }
        .reader-sidebar { width: 300px; background-color: var(--bg-panel); border-right: 1px solid var(--border-color); overflow-y: auto; padding: 30px 20px; display: flex; flex-direction: column; }
        .reader-content { flex: 1; overflow-y: auto; padding: 60px 40px; }
        .reader-content-inner { max-width: 900px; margin: 0 auto; }
        .toc-link { display: block; color: var(--text-muted); text-decoration: none; padding: 10px 15px; margin-bottom: 5px; border-radius: 6px; transition: all 0.2s; font-size: 14px; border-left: 2px solid transparent; }
        .toc-link:hover { background: rgba(255,255,255,0.03); color: var(--text-bright); border-left: 2px solid var(--text-muted); }
        .back-btn { display: inline-flex; align-items: center; gap: 10px; color: var(--text-muted); text-decoration: none; margin-bottom: 40px; font-size: 14px; font-weight: 500; transition: 0.2s; }
        .back-btn:hover { color: #fff; }
        .reader-content h1 { font-size: 32px; color: #bfae95; margin-bottom: 10px; }
        .reader-content h2 { font-size: 22px; color: #fff; margin-top: 50px; margin-bottom: 20px; border-bottom: 1px solid var(--border-color); padding-bottom: 10px; }
        .chapter-content {
            background: rgba(255,255,255,0.02);
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 12px;
            padding: 18px 20px;
            margin-bottom: 18px;
        }
        .chapter-content p,
        .chapter-content li {
            font-size: 16px;
            line-height: 1.7;
            color: var(--text-normal);
        }
        .chapter-content img {
            max-width: 100%;
            border-radius: 10px;
            margin: 14px 0;
            border: 1px solid var(--border-color);
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
        }
        .chapter-content table {
            width: 100%;
            border-collapse: collapse;
            margin: 14px 0;
        }
        .chapter-content table td,
        .chapter-content table th {
            border: 1px solid var(--border-color);
            padding: 10px;
            color: var(--text-normal);
        }
        .chapter-content blockquote {
            border-left: 4px solid var(--color-primary);
            margin: 14px 0;
            padding: 8px 14px;
            color: #d4d4d8;
            background: rgba(255,255,255,0.03);
        }
        .chapter-images {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 14px;
            margin-top: 14px;
        }
    </style>
</head>
<body>
    <div class="reader-layout">
        <nav class="reader-sidebar">
            <a href="index.html" class="back-btn"><i class="fa-solid fa-arrow-left"></i> Zpět do výcvikového centra</a>
            <h3 style="color: var(--text-bright); font-size: 13px; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 15px;">Osnova dokumentu</h3>
            <div id="toc">
                <p style="color: var(--text-muted); font-size: 13px;">Načítám kapitoly...</p>
            </div>
        </nav>

        <main class="reader-content">
            <div class="reader-content-inner">
                <span style="color: var(--text-muted); font-weight: 600; font-size: 12px; text-transform: uppercase; letter-spacing: 1px;">Oficiální manuál 160th SOAR</span>
                <h1 id="doc-nazev">Načítám dokument...</h1>
                <p id="doc-popis" style="color: var(--text-muted); font-size: 18px; margin-bottom: 50px;"></p>
                <div id="doc-kapitoly"></div>
                <div style="height: 350px;"></div>
            </div>
        </main>
    </div>

    <script>
        const prihlaseny = JSON.parse(sessionStorage.getItem('prihlasenyRekrut'));
        if (!prihlaseny) window.location.href = 'login.html';

        const urlParams = new URLSearchParams(window.location.search);
        const idMaterialu = urlParams.get('id');

        function sanitizeText(v) {
            return String(v || '');
        }

        if (!idMaterialu) {
            document.getElementById('doc-nazev').innerText = "Chyba: Nebyl vybrán žádný manuál.";
        } else {
            fetch(`/api/materialy/${idMaterialu}`)
                .then(res => res.json())
                .then(mat => {
                    document.getElementById('doc-nazev').innerText = sanitizeText(mat.nazev);
                    document.getElementById('doc-popis').innerText = sanitizeText(mat.popis);
                });

            fetch(`/api/materialy/${idMaterialu}/kapitoly`)
                .then(res => res.json())
                .then(kapitoly => {
                    const toc = document.getElementById('toc');
                    const obsahKontejner = document.getElementById('doc-kapitoly');
                    toc.innerHTML = '';
                    obsahKontejner.innerHTML = '';

                    if (!kapitoly || kapitoly.length === 0) {
                        toc.innerHTML = '<p style="color: var(--text-muted); font-size: 13px;">Dokument nemá žádné kapitoly.</p>';
                        obsahKontejner.innerHTML = '<p style="color: var(--text-muted);">Velení do tohoto manuálu ještě nevložilo text.</p>';
                        return;
                    }

                    kapitoly.forEach((k) => {
                        const kId = `kapitola-${k.id}`;
                        toc.innerHTML += `<a href="#${kId}" class="toc-link">${sanitizeText(k.nazev_kapitoly)}</a>`;

                        const imgs = Array.isArray(k.obrazky) ? k.obrazky : [];
                        const imageHtml = imgs.length
                            ? `<div class="chapter-images">${imgs.map(url => `<img src="${url}" alt="Ilustrace k materiálu">`).join('')}</div>`
                            : '';

                        obsahKontejner.innerHTML += `
                            <h2 id="${kId}">${sanitizeText(k.nazev_kapitoly)}</h2>
                            <div class="chapter-content">
                                ${k.obsah || ''}
                                ${imageHtml}
                            </div>
                        `;
                    });
                });
        }
    </script>
</body>
</html>
