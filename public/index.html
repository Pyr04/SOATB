<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <title>SOATB - Výcvikové centrum</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="veleni-layout">
        
        <!-- LEVÝ POSTRANNÍ PANEL -->
        <nav class="sidebar">
            <div class="sidebar-hlavicka">
                <h2 style="margin: 0;">SOATB <span style="color: #666; font-size: 14px;">by 160th</span></h2>
                <div class="sidebar-user">Studijní portál</div>
            </div>
            
            <div class="sidebar-kategorie">Navigace</div>
            <button id="btn-testy" class="tab-btn aktivni" onclick="otevriSekci('sekce-testy', this)">
                <i class="fa-solid fa-list-check"></i> Certifikační moduly
            </button>
            <button class="tab-btn" onclick="otevriSekci('sekce-materialy', this)">
                <i class="fa-solid fa-book-open"></i> Studijní materiály
            </button>
            
            <div style="margin-top: auto; padding-bottom: 20px;">
                <button class="tab-btn" onclick="odhlasit()" style="color: var(--color-danger);">
                    <i class="fa-solid fa-power-off"></i> Odhlásit se
                </button>
            </div>
        </nav>

        <!-- HLAVNÍ OBSAH -->
        <main class="obsah-panelu">
            
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; background-color: var(--bg-panel); padding: 20px 30px; border-radius: 8px; border: 1px solid var(--border-color);">
                <div style="display: flex; align-items: center; gap: 20px;">
                    <img src="logo.png" alt="160th SOAR Logo" style="width: 70px; height: 70px; object-fit: contain;">
                    <div>
                        <h1 style="border: none; margin: 0 0 4px 0; padding: 0; font-size: 22px;">Studijní portál</h1>
                        <span style="color: var(--text-muted); font-weight: 600; letter-spacing: 1px; text-transform: uppercase; font-size: 11px;">160th Special Operations Aviation Regiment</span>
                    </div>
                </div>
                
                <a href="veleni.html" id="btn-veleni" class="btn" style="background-color: var(--bg-body); color: var(--text-normal); border: 1px dashed var(--color-warning); display: none;">
                    <i class="fa-solid fa-shield-halved" style="color: var(--color-warning); margin-right: 8px;"></i>Velitelský panel
                </a>
            </div>
            
            <div class="karta" style="margin-bottom: 30px; padding: 15px 24px;">
                <label style="color: var(--text-muted); font-weight: 600; font-size: 11px; text-transform: uppercase; margin: 0;">Přihlášený profil:</label>
                <h3 id="info-jmeno" style="margin: 0; color: var(--color-primary); font-size: 18px;">Načítám...</h3>
            </div>
            
            <!-- SEKCE 1: TESTY -->
            <section id="sekce-testy" class="sekce-obsah aktivni">
                <h2>Výcvikové moduly k plnění</h2>
                <div id="seznam-testu">
                    <p style="color: var(--text-muted); font-style: italic;">Načítám moduly...</p>
                </div>
            </section>

            <!-- SEKCE 2: STUDIJNÍ MATERIÁLY (DYNAMICKÉ Z DATABÁZE) -->
            <section id="sekce-materialy" class="sekce-obsah">
                <h2>Knihovna teorie a manuálů</h2>
                <div id="seznam-materialu">
                    <p style="color: var(--text-muted); font-style: italic;">Načítám manuály z databáze...</p>
                </div>
            </section>

        </main>
    </div>

    <script>
    const prihlaseny = JSON.parse(sessionStorage.getItem('prihlasenyRekrut'));
    if (!prihlaseny) { window.location.href = 'login.html'; }

    if (prihlaseny.je_admin === 1 || prihlaseny.je_admin === "1" || prihlaseny.je_admin === true) {
        document.getElementById('btn-veleni').style.display = 'inline-flex';
    }

    const idRekruta = prihlaseny.id;
    document.getElementById('info-jmeno').innerText = `${prihlaseny.jmeno} (${prihlaseny.hodnost})`;

    function odhlasit() {
        sessionStorage.removeItem('prihlasenyRekrut');
        window.location.href = 'login.html';
    }

    function otevriSekci(idSekce, tlacitko) {
        document.querySelectorAll('.sekce-obsah').forEach(s => s.classList.remove('aktivni'));
        if (tlacitko) {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('aktivni'));
            tlacitko.classList.add('aktivni');
        }
        document.getElementById(idSekce).classList.add('aktivni');
    }
    
    nactiTestyProRekruta();
    nactiMaterialy();

    // --- TICHÝ AUTO-REFRESH (KAŽDÝCH 10 SEKUND) ---
    setInterval(() => {
        nactiTestyProRekruta();
        nactiMaterialy();
    }, 10000);

    async function nactiTestyProRekruta() {
        const kontejner = document.getElementById('seznam-testu');
        try {
            // cache: 'no-store' ignoruje paměť prohlížeče a vynutí čistá data ze serveru
            const res = await fetch('/api/testy', { cache: 'no-store' });
            const testy = await res.json(); 
            
            if (testy.length === 0) { 
                kontejner.innerHTML = '<p style="color: var(--text-muted);">Žádné moduly.</p>'; 
                return; 
            }

            let zobrazeno = 0;
            let novyHtml = ''; // Kód sestavíme do paměti, aby se zabránilo problikávání obrazovky

            for (const test of testy) {
                const stavRes = await fetch(`/api/stav/${idRekruta}/${test.id}`, { cache: 'no-store' });
                const stavData = await stavRes.json();
                
                if (stavData.stav !== 0) {
                    zobrazeno++;
                    novyHtml += `
                        <div class="karta">
                            <div style="display: flex; justify-content: space-between; align-items: center;">
                                <div><h2 style="margin-bottom: 4px; border: none; padding: 0;">${test.nazev}</h2><p style="color: var(--text-muted); margin: 0; font-size: 14px;">${test.popis}</p></div>
                                <div>${stavData.stav === 1 ? `<a href="test.html?id_rekruta=${idRekruta}&id_testu=${test.id}" class="btn btn-primary">Spustit zkoušku</a>` : '<span class="badge badge-success">✓ Splněno</span>'}</div>
                            </div>
                        </div>`;
                }
            }
            
            if (zobrazeno === 0) {
                kontejner.innerHTML = '<p style="color: var(--text-muted); font-style: italic; background: rgba(255,255,255,0.02); padding: 20px; border-radius: 8px; border: 1px dashed var(--border-color);">Momentálně nemáš od velení přidělené žádné aktivní výcvikové moduly.</p>';
            } else {
                kontejner.innerHTML = novyHtml; // Překreslení se provede naráz
            }
        } catch(e) { console.error("Chyba načítání:", e); }
    }

    function nactiMaterialy() {
        const kontejner = document.getElementById('seznam-materialu');
        
        fetch('/api/materialy?admin=' + prihlaseny.je_admin, { cache: 'no-store' }).then(async res => {
            if (res.status === 403) {
                kontejner.innerHTML = '<div style="padding: 30px; background: rgba(220, 38, 38, 0.1); border: 1px solid rgba(220, 38, 38, 0.3); border-radius: 8px; color: var(--color-danger); text-align: center;"><i class="fa-solid fa-lock" style="font-size: 32px; margin-bottom: 15px;"></i><br><b style="font-size: 18px;">Přístup odepřen</b><br><span style="color: var(--text-muted); font-size: 14px;">Velení dočasně uzamklo studijní materiály (probíhá certifikační zkouška).</span></div>';
                return null;
            }
            return res.json();
        }).then(materialy => {
            if (!materialy) return; 
            if(materialy.length === 0) {
                kontejner.innerHTML = '<p style="color: var(--text-muted); font-style: italic;">Velení zatím nevložilo žádné studijní materiály.</p>';
                return;
            }
            let novyHtml = '';
            materialy.forEach(m => {
                novyHtml += `
                    <div class="karta">
                        <h3 style="margin-top: 0; color: #bfae95;"><i class="fa-solid fa-file-lines" style="margin-right: 10px;"></i>${m.nazev}</h3>
                        <p style="color: var(--text-muted); font-size: 14px;">${m.popis}</p>
                        <a href="cteni.html?id=${m.id}" class="btn btn-nav" style="margin: 15px 0 0 0; display: inline-block; text-decoration: none;">Otevřít interaktivní manuál</a>
                    </div>
                `;
            });
            kontejner.innerHTML = novyHtml;
        });
    }
</script>
</body>
</html>
